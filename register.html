<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join / Sign in — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Anglican Students' Fellowship — UNIBEN/UBTH">
  <meta property="og:description" content="Arise, Shine! Christian fellowship for students of Uniben and UBTH.">
  <meta property="og:image" content="https://YOUR-DOMAIN-HERE/logo.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav>
      <a href="index.html">About</a>
      <a href="leadership.html">Leadership</a>
      <a href="ministry-groups.html" id="nav-ministry" style="display:none">Ministry Groups</a>
      <a href="announcements.html" id="nav-announcements" style="display:none">Announcements</a>
      <a href="messages.html" id="nav-messages" style="display:none">Messages</a>
      <a href="chat.html" id="nav-chat" style="display:none">Ask ASF</a>
      <a href="profile.html" id="nav-profile" style="display:none">My Profile</a>
      <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
      <span id="nav-auth-slot"></span>
    </nav>
  </header>

  <div class="container-narrow">
    <h1 id="page-heading">Join ASF</h1>
    <p class="hint" id="page-subheading">One form creates your account and your membership record.</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-register" type="button">Register</button>
      <button class="tab-btn" id="tab-signin" type="button">Sign in</button>
    </div>

    <p id="forgot-link-wrap" style="display:none; margin-top:-0.5rem;">
      <a href="#" id="forgot-link" class="hint">Forgot your password?</a>
    </p>

    <form id="register-form">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" required>
      </div>
      <div class="field field-row">
        <div>
          <label for="department">Department</label>
          <input id="department" required>
        </div>
        <div>
          <label for="level">Level</label>
          <select id="level" required>
            <option value="" disabled selected>Select</option>
            <option>100</option>
            <option>200</option>
            <option>300</option>
            <option>400</option>
            <option>500</option>
            <option>600</option>
            <option>Postgraduate</option>
            <option>Part-time</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Date of birth (day &amp; month only)</label>
        <div class="field-row">
          <select id="dob-day" required>
            <option value="" disabled selected>Day</option>
          </select>
          <select id="dob-month" required>
            <option value="" disabled selected>Month</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input id="location" placeholder="Hall / area" required>
      </div>
      <div class="field">
        <label for="ministryGroup">Ministry group</label>
        <select id="ministryGroup" required>
          <option value="" disabled selected>Select a ministry group</option>
        </select>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" required>
      </div>
      <p class="error-text" id="form-error" style="display:none;"></p>
      <button class="btn btn-solid" type="submit" style="width:100%; padding:0.65rem;" id="submit-btn">
        Create account
      </button>
    </form>
  </div>

  <footer>Anglican Students&rsquo; Fellowship — Uniben / UBTH &middot; Arise, Shine!</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="ministry-groups-data.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script src="register.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Anglican Students' Fellowship — UNIBEN/UBTH">
  <meta property="og:description" content="Arise, Shine! Christian fellowship for students of Uniben and UBTH.">
  <meta property="og:image" content="https://YOUR-DOMAIN-HERE/logo.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav>
      <a href="index.html">About</a>
      <a href="leadership.html">Leadership</a>
      <a href="ministry-groups.html" id="nav-ministry" style="display:none">Ministry Groups</a>
      <a href="announcements.html" id="nav-announcements" style="display:none">Announcements</a>
      <a href="chat.html" id="nav-chat" style="display:none">Ask ASF</a>
      <a href="profile.html" id="nav-profile" style="display:none">My Profile</a>
      <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
      <span id="nav-auth-slot"></span>
    </nav>
  </header>

  <div class="container-narrow">
    <h1>My Profile</h1>
    <p class="hint">Update your own details below.</p>

    <form id="profile-form">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" required>
      </div>
      <div class="field field-row">
        <div>
          <label for="department">Department</label>
          <input id="department" required>
        </div>
        <div>
          <label for="level">Level</label>
          <select id="level" required>
            <option>100</option><option>200</option><option>300</option>
            <option>400</option><option>500</option><option>600</option>
            <option>Postgraduate</option><option>Part-time</option>
          </select>
        </div>
      </div>
      <div class="field field-row">
        <div>
          <label for="dob">Date of birth</label>
          <input id="dob" type="date" required>
        </div>
        <div>
          <label for="location">Location</label>
          <input id="location" required>
        </div>
      </div>
      <div class="field">
        <label for="ministryGroup">Ministry group</label>
        <select id="ministryGroup" required></select>
      </div>
      <p class="error-text" id="profile-error" style="display:none;"></p>
      <p class="hint" id="profile-success" style="display:none; color:#166534;"></p>
      <button class="btn btn-solid" type="submit" style="width:100%; padding:0.65rem;">Save changes</button>
    </form>
  </div>

  <footer>Anglican Students&rsquo; Fellowship — Uniben / UBTH &middot; Arise, Shine!</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="protect.js"></script>
  <script src="ministry-groups-data.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script src="profile.js"></script>
</body>
</html>

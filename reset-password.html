<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Anglican Students' Fellowship — UNIBEN/UBTH">
  <meta property="og:description" content="Arise, Shine! Christian fellowship for students of Uniben and UBTH.">
  <meta property="og:image" content="https://YOUR-DOMAIN-HERE/logo.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav>
      <a href="index.html">About</a>
      <a href="leadership.html">Leadership</a>
    </nav>
  </header>

  <div class="container-narrow">
    <h1>Set a new password</h1>
    <p class="hint" id="subheading">Enter a new password for your account below.</p>

    <form id="reset-form">
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="6" required>
      </div>
      <p class="error-text" id="reset-error" style="display:none;"></p>
      <p class="hint" id="reset-success" style="display:none; color:#166534;"></p>
      <button class="btn btn-solid" type="submit" style="width:100%; padding:0.65rem;" id="reset-submit-btn">
        Update password
      </button>
    </form>
  </div>

  <footer>Anglican Students&rsquo; Fellowship — Uniben / UBTH &middot; Arise, Shine!</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="nav-hide.js"></script>
  <script>
    // Supabase automatically picks up the recovery token from the URL and
    // fires a PASSWORD_RECOVERY event once a session is established.
    let recoveryReady = false;
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('reset-error');
      const successEl = document.getElementById('reset-success');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const newPassword = document.getElementById('new-password').value;
      const { error } = await sb.auth.updateUser({ password: newPassword });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        return;
      }
      successEl.textContent = 'Password updated! Redirecting you to sign in…';
      successEl.style.display = 'block';
      setTimeout(() => { window.location.href = 'register.html'; }, 1800);
    });
  </script>
</body>
</html>

  <div class="container" style="max-width:640px;">
    <h1>Songs</h1>
    <p class="hint">The fellowship's song list, maintained by AMM.</p>

    <div id="manage-section" style="display:none;">
      <form id="song-form" class="card" style="margin-top:1rem;">
        <div class="field">
          <label for="song-title">Title</label>
          <input id="song-title" placeholder="Song title" required>
        </div>
        <div class="field">
          <label for="song-reference">Reference (optional)</label>
          <input id="song-reference" placeholder="e.g. hymn number, artist">
        </div>
        <button class="btn btn-solid" type="submit">Add Song</button>
      </form>
    </div>

    <div id="songs-list" style="margin-top:1.5rem;">
      <div class="skeleton" style="height:3rem;"></div>
      <div class="skeleton" style="height:3rem;"></div>
    </div>
  </div>

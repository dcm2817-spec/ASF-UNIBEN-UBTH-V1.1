<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ministry Groups — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Anglican Students' Fellowship — UNIBEN/UBTH">
  <meta property="og:description" content="Arise, Shine! Christian fellowship for students of Uniben and UBTH.">
  <meta property="og:image" content="https://YOUR-DOMAIN-HERE/logo.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav>
      <a href="index.html">About</a>
      <a href="leadership.html">Leadership</a>
      <a href="ministry-groups.html" id="nav-ministry" style="display:none">Ministry Groups</a>
      <a href="announcements.html" id="nav-announcements" style="display:none">Announcements</a>
      <a href="messages.html" id="nav-messages" style="display:none">Messages</a>
      <a href="songs.html" id="nav-songs" style="display:none">Songs</a>
      <a href="chat.html" id="nav-chat" style="display:none">Ask ASF</a>
      <a href="profile.html" id="nav-profile" style="display:none">My Profile</a>
      <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
      <span id="nav-auth-slot"></span>
    </nav>
  </header>

  <div class="container">
    <h1>Ministry Groups</h1>
    <p class="hint">Every member belongs to at least one, and at most two, ministry groups.</p>
    <div class="grid-2" id="groups-list" style="margin-top:1.5rem;"></div>
  </div>

  <footer>Anglican Students&rsquo; Fellowship — Uniben / UBTH &middot; Arise, Shine!</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="protect.js"></script>
  <script src="ministry-groups-data.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script>
    async function render() {
      const { data: { session } } = await sb.auth.getSession();
      let myGroups = [];
      if (session) {
        const { data } = await sb.from('members').select('ministry_group, ministry_group_2').eq('id', session.user.id).single();
        myGroups = data ? [data.ministry_group, data.ministry_group_2].filter(Boolean) : [];
      }

      document.getElementById('groups-list').innerHTML = MINISTRY_GROUPS.map((g) => {
        const isMine = myGroups.includes(g.name);
        return `
        <div class="card" style="${isMine ? 'border-color:var(--sunrise); border-width:2px;' : ''}">
          <p class="hint" style="color:var(--sunrise); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; margin-bottom:0.2rem;">
            <span class="group-icon">${g.icon || ''}</span> ${g.code}${isMine ? ' &middot; Your group' : ''}
          </p>
          <h3 style="margin:0 0 0.3rem;">${g.name}</h3>
          <p class="hint" style="margin:0 0 0.6rem;">${g.summary}</p>
          <ul style="margin:0; padding-left:1.1rem;">
            ${g.details.map((d) => `<li>${d}</li>`).join('')}
          </ul>
        </div>
      `;
      }).join('');
    }
    render();
  </script>
</body>
</html>
